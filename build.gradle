plugins {
	alias(libs.plugins.fabric.loom)
	alias(libs.plugins.yamlang)
}

version = "0.5.2-1.21.11"
group = "net.green_jab.nekomasfixed"

base {
	archivesName = project.name
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/nekomasfixed.accesswidener")
	mods {
		register("nekomasfixed") {
			sourceSet(sourceSets["main"])
			sourceSet(sourceSets["client"])
		}
	}
	decompilers {
		vineflower {
			options.put("mark-corresponding-synthetics", "1")
		}
	}
	runs {
		datagen {
			client()
			name "Data Generation"
			vmArg "-Dfabric-api.datagen"
			vmArg "-Dfabric-api.datagen.output-dir=${file('src/main/generated')}"
			runDir "build/datagen"
		}
	}
}

sourceSets {
	main {
		resources {
			srcDirs += 'src/main/generated'
		}
	}
}

repositories {
	maven { url "https://maven.solo-studios.ca/releases/" }
	maven { url "https://maven.fabricmc.net/" }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven {
		// location of the maven that hosts JEI files since January 2023
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		// location of a maven mirror for JEI files, as a fallback
		name = "ModMaven"
		url = "https://modmaven.dev"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	mavenCentral()
}

dependencies {
	minecraft(libs.minecraft)
	mappings(variantOf(libs.yarn.mappings) { classifier("v2") })
	modImplementation(libs.fabric.loader)
	modImplementation(libs.fabric.api)
	vineflowerDecompilerClasspath(libs.vineflower)
	modApi "me.shedaniel.cloth:cloth-config-fabric:21.11.153"
	modApi "com.terraformersmc:modmenu:17.0.0"

	// compile against the JEI API but do not include it at runtime
	modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
	compileOnly("net.mezzdev.config:mezz_config-${minecraft_version}-config-api:${mezz_config_version}")
	// at runtime, use the full JEI jar for Fabric
	modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
	modLocalRuntime("net.mezzdev.config:mezz_config-${minecraft_version}-fabric:${mezz_config_version}")
}

tasks.processResources {
	filesMatching("fabric.mod.json") {
		expand(
				"version": project.version,
				"fabric_api": libs.versions.fabric.api.get(),
				"minecraft": libs.versions.minecraft.get(),
		)
	}
}

yamlang {
	targetSourceSets = [sourceSets.main]
	inputDir.set("assets/nekomasfixed/lang")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
}

afterEvaluate {
	loom {
		runs {
			configureEach {
				vmArgs("-Xmx2G")
				property("fabric.development", "true")
				property("mixin.debug", "true")
				property("mixin.debug.export.decompile", "false")
				property("mixin.debug.verbose", "true")
				property("mixin.dumpTargetOnFailure", "true")
				property("mixin.hotSwap", "true")
				ideConfigGenerated(true)
			}
		}
	}
}